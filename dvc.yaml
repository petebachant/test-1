stages:
  build-paper:
    cmd: calkit latex build -e tex --no-check paper/main.tex
    deps:
      - paper/main.tex
      - paper/figures
      - .calkit/env-locks/tex
    outs:
      - paper/main.pdf
    desc: Automatically generated from the 'build-paper' stage in calkit.yaml.
      Changes made here will be overwritten.
  build-paper2:
    cmd: calkit latex build -e tex --no-check paper2/main.tex
    deps:
      - paper2/main.tex
      - paper2/thing.txt
      - paper2/figures
      - .calkit/env-locks/tex
    outs:
      - paper2/main.pdf
    desc: Automatically generated from the 'build-paper2' stage in calkit.yaml.
      Changes made here will be overwritten.
  build-report:
    cmd: calkit latex build -e tex --no-check report/main.tex
    deps:
      - report/main.tex
      - report/references.bib
      - report/figures
      - .calkit/env-locks/tex
    outs:
      - report/main.pdf
    desc: Automatically generated from the 'build-report' stage in calkit.yaml.
      Changes made here will be overwritten.
