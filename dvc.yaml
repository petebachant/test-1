stages:
  notebook:
    cmd: calkit nb execute --environment py --no-check --to html 
      "notebook.ipynb"
    deps:
      - .calkit/notebooks/cleaned/notebook.ipynb
      - .calkit/envs/py/uv.lock
    outs:
      - figures/test.png
      - .calkit/notebooks/executed/notebook.ipynb:
          cache: true
      - .calkit/notebooks/html/notebook.html:
          cache: true
    desc: Automatically generated from the 'notebook' stage in 
      calkit.yaml. Changes made here will be overwritten.
  build-paper:
    cmd: calkit latex build -e tex --no-check paper/main.tex
    deps:
      - paper/main.tex
      - paper/figures
      - .calkit/env-locks/tex
    outs:
      - paper/main.pdf
    desc: Automatically generated from the 'build-paper' stage in 
      calkit.yaml. Changes made here will be overwritten.
  build-paper2:
    cmd: calkit latex build -e tex --no-check paper2/main.tex
    deps:
      - paper2/main.tex
      - paper2/thing.txt
      - paper2/figures
      - .calkit/env-locks/tex
    outs:
      - paper2/main.pdf
    desc: Automatically generated from the 'build-paper2' stage in 
      calkit.yaml. Changes made here will be overwritten.
  build-paper2-diff-main:
    cmd: calkit latex diff -e tex --no-check --from 
      0abbf805ec9c1ff0f2b1764ea55d78b3bdf922a0 --to 
      bd2cb379e3c0d05df4841de32f575154865b6e2d --output-dir 
      .calkit/latex-diffs/main paper2/main.tex
    deps:
      - paper2/main.tex
      - paper2/thing.txt
      - paper2/figures
      - .calkit/env-locks/tex
    outs:
      - .calkit/latex-diffs/main/paper2/main.pdf
    desc: Automatically generated from the 'build-paper2' stage in 
      calkit.yaml. Changes made here will be overwritten.
  build-report:
    cmd: calkit latex build -e tex --no-check report/main.tex
    deps:
      - report/main.tex
      - report/references.bib
      - report/figures
      - .calkit/env-locks/tex
    outs:
      - report/main.pdf
    desc: Automatically generated from the 'build-report' stage in 
      calkit.yaml. Changes made here will be overwritten.
  notebook-julia:
    cmd: calkit nb execute --environment j1 --no-check --to html 
      "notebook-julia.ipynb"
    deps:
      - .calkit/notebooks/cleaned/notebook-julia.ipynb
      - Manifest.toml
    outs:
      - figures/sine.png
      - .calkit/notebooks/executed/notebook-julia.ipynb:
          cache: false
      - .calkit/notebooks/html/notebook-julia.html:
          cache: false
    desc: Automatically generated from the 'notebook-julia' stage in 
      calkit.yaml. Changes made here will be overwritten.
  notebooks-conda-polars:
    cmd: calkit nb execute --environment conda-polars --no-check --to 
      html "notebooks/conda-polars.ipynb"
    deps:
      - .calkit/notebooks/cleaned/notebooks/conda-polars.ipynb
      - .calkit/env-locks/conda-polars
    outs:
      - notebooks/data.avro
      - notebooks/data.parquet
      - .calkit/notebooks/executed/notebooks/conda-polars.ipynb:
          cache: false
      - .calkit/notebooks/html/notebooks/conda-polars.html:
          cache: false
    desc: Automatically generated from the 'notebooks-conda-polars' 
      stage in calkit.yaml. Changes made here will be overwritten.
  notebooks-other:
    cmd: calkit nb execute --environment py --no-check --to html 
      "notebooks/other.ipynb"
    deps:
      - .calkit/notebooks/cleaned/notebooks/other.ipynb
      - .calkit/envs/py/uv.lock
    outs:
      - results/sup.json:
          cache: false
          persist: false
      - .calkit/notebooks/executed/notebooks/other.ipynb:
          cache: false
      - .calkit/notebooks/html/notebooks/other.html:
          cache: false
    desc: Automatically generated from the 'notebooks-other' stage in 
      calkit.yaml. Changes made here will be overwritten.
