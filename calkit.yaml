owner: petebachant
name: test-1
title: Test 1
description: ""
hub: localhost:5173
git_repo_url: https://github.com/petebachant/test-1

storage:
  dvc:
    kind: calkit-cloud
  git-lfs:
    kind: hugging-face
    repo_url: petebachant/test-1-lfs

environments:
  tex:
    kind: docker
    image: texlive/texlive:latest-full
  py:
    kind: uv
    path: .calkit/envs/py/pyproject.toml
  cluster:
    kind: slurm
    partition: gpu
    host: sup.lol.edu
  j1:
    kind: julia
    path: Project.toml
    julia: "1.12"
  jupydocker:
    kind: docker
    image: quay.io/jupyter/scipy-notebook:2025-12-31
  conda-polars:
    path: environment.yml
    kind: conda

pipeline:
  stages:
    notebook:
      kind: jupyter-notebook
      notebook_path: notebook.ipynb
      environment: py
      outputs:
        - figures/test.png
    build-paper:
      kind: latex
      target_path: paper/main.tex
      environment: tex
      inputs:
        - paper/figures
    build-paper2:
      kind: latex
      target_path: paper2/main.tex
      environment: tex
      inputs:
        - paper2/thing.txt
        - paper2/figures
    build-report:
      kind: latex
      target_path: report/main.tex
      environment: tex
      inputs:
        - report/references.bib
        - report/figures
    notebook-julia:
      kind: jupyter-notebook
      notebook_path: notebook-julia.ipynb
      html_storage: git
      executed_ipynb_storage: git
      environment: j1
      outputs:
        - figures/sine.png
    notebooks-conda-polars:
      kind: jupyter-notebook
      notebook_path: notebooks/conda-polars.ipynb
      html_storage: git
      executed_ipynb_storage: git
      environment: conda-polars
      outputs:
        - notebooks/data.avro
        - notebooks/data.parquet
    notebooks-other:
      kind: jupyter-notebook
      notebook_path: notebooks/other.ipynb
      html_storage: git
      executed_ipynb_storage: git
      environment: py
      outputs:
        - path: results/sup.json
          storage: git

publications:
  - path: paper/main.pdf
    title: A paper about things
    description:
    kind: journal-article
    stage: build-paper
  - path: paper2/main.pdf
    title: A paper about things
    description:
    kind: report
    stage: build-paper2
  - path: report/main.pdf
    title: A Simple Workflow for Processing and Visualizing Experimental
      Data
    description:
    kind: report
    stage: build-report

showcase:
  - publication: paper/main.pdf

questions:
  - question: What's up?
    hypothesis: Not much.
    answer: A lot.
    evidence:
      - kind: result
        path: results/sup.json
        key: proof
        explanation: Pretty obvious.
  - question: This is another question?
    hypothesis: I expect Caltech Pete to answer.
    answer: Pete indeed did answer.
    evidence:
      - kind: publication
        path: paper/main.pdf
  - question: Will this update my full name?
    answer: Sure, yeah. Whatever.
  - Can I still add a question?

  - Can I add another?
notebooks:
  - path: notebook.ipynb
    environment: py
  - path: notebooks/conda-polars.ipynb
    environment: conda-polars
  - path: notebooks/other.ipynb
    environment: py

overleaf_sync:
